<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        BAPS Cairns Annakut
    </title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</head>

<body>

<div class="page">

    <div class="hero">

        <h1>
            BAPS Cairns
        </h1>

        <h2>
            Annakut Prasad Allocation
        </h2>

        <p>
            Select the Annakut items you would like to prepare for Thakorji.
        </p>

    </div>

    <div class="search-section">

        <input
            type="text"
            id="searchBox"
            placeholder="🔍 Search items">

            <h3>Categories</h3>

            <div id="categoryChips">
            </div>
            
            <h3>Item Types</h3>
            
            <div id="itemTypeChips">
            </div>
            

    </div>

    <div id="selectedBar">

        <div class="selected-title">
            Selected Items
        </div>

        <div id="selectedItems">
            None Selected
        </div>

    </div>

    <div id="items">
        Loading Items...
    </div>

    <div class="form-card">

        <h3>
            Additional Item (Optional)
        </h3>

        <input
            type="text"
            id="additional"
            placeholder="Additional Item">

        <h3>
            Your Details
        </h3>

        <input
            type="text"
            id="name"
            placeholder="Full Name">

        <input
            type="text"
            id="phone"
            placeholder="Australian Mobile Number">

        <input
            type="email"
            id="email"
            placeholder="Email Address">

        <button onclick="submitForm()">
            Submit Seva
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
